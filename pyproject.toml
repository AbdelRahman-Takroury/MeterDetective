[project]
name = "meterdetective"
version = "0.1.0"
description = "AI-assisted smart-meter anomaly investigation platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "numpy>=2.5.3",
  "pandas>=3.0.6",
  "pgvector>=0.4,<1",
  "plotly>=7.1.0",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "scikit-learn>=1.9.1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings --basetemp=.pytest-tmp"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["app"]
