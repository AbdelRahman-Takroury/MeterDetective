services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meterdetective}
      POSTGRES_USER: ${POSTGRES_USER:-meterdetective}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meterdetective}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meterdetective}:${POSTGRES_PASSWORD:-meterdetective}@db:5432/${POSTGRES_DB:-meterdetective}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "8000:8000"

volumes:
  postgres_data:

